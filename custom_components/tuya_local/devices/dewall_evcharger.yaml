name: EV charger
products:
  - id: witok7vhhjohtr02
    manufacturer: dé
    model: Wall charger
  - id: gxrtu5vljdthtd3g
    manufacturer: dé
    model: EV Charger gd version

entities:
  - entity: sensor
    translation_key: status
    class: enum
    category: diagnostic
    dps:
      - id: 109
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: SLEEP
            value: sleep
          - dps_val: IDLE
            value: idle
          - dps_val: IDLEINS
            value: plugged_in
          - dps_val: WORKING
            value: charging
          - dps_val: WAIT
            value: waiting
          - dps_val: ERRORPAUSE
            value: fault
          - dps_val: PAUSE
            value: paused
          - dps_val: STOP
            value: stopped

  - entity: sensor
    name: Metrics
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: metrics

  - entity: sensor
    name: Self test
    category: diagnostic
    hidden: true
    dps:
      - id: 103
        type: string
        optional: true
        name: value

  - entity: sensor
    name: Alarm
    category: diagnostic
    hidden: true
    dps:
      - id: 104
        type: string
        optional: true
        name: value

  - entity: sensor
    name: Charge history
    category: diagnostic
    hidden: true
    dps:
      - id: 105
        type: string
        optional: true
        name: value

  - entity: button
    name: Charge
    icon: "mdi:ev-station"
    dps:
      - id: 140
        type: boolean
        optional: true
        name: button

  - entity: button
    name: Stop
    icon: "mdi:stop"
    dps:
      - id: 140
        type: boolean
        optional: true
        name: button
        mapping:
          - dps_val: false
            value: true

  - entity: button
    name: Reset
    category: config
    dps:
      - id: 141
        type: boolean
        optional: true
        name: button

  - entity: button
    class: restart
    category: config
    dps:
      - id: 142
        type: boolean
        optional: true
        name: button

  - entity: number
    name: Charge current
    category: config
    class: current
    dps:
      - id: 150
        type: integer
        name: value
        unit: A
        range:
          min: 1
          max: 16
      - id: 152
        type: integer
        name: maximum
      - id: 107
        type: string
        name: steps

  - entity: number
    name: Maximum current
    category: config
    class: current
    dps:
      - id: 152
        type: integer
        name: value
        unit: A
        range:
          min: 1
          max: 32

  - entity: select
    name: Plug in action
    icon: "mdi:ev-plug-type2"
    category: config
    dps:
      - id: 154
        type: integer
        optional: true
        name: option
        mapping:
          - dps_val: 0
            value: Prompt
          - dps_val: 1
            value: Charge
          - dps_val: 2
            value: Idle

  - entity: switch
    name: NFC
    icon: "mdi:nfc"
    category: config
    hidden: unavailable
    dps:
      - id: 155
        type: boolean
        optional: true
        name: switch
      - id: 157
        type: integer
        optional: true
        name: available
        mapping:
          - dps_val: 1
            value: false
          - value: true

  - entity: switch
    name: Unearthed
    icon: "mdi:lightning-bolt-circle"
    category: config
    dps:
      - id: 156
        type: boolean
        optional: true
        name: switch

  - entity: switch
    name: Single phase mode
    icon: "mdi:electric-switch"
    category: config
    dps:
      - id: 110
        type: boolean
        optional: true
        name: switch

  - entity: number
    name: Charge countdown
    icon: "mdi:timer"
    category: config
    dps:
      - id: 108
        type: integer
        optional: true
        name: value
        unit: min
        range:
          min: 0
          max: 1440

  - entity: binary_sensor
    name: Plug charge
    category: diagnostic
    dps:
      - id: 190
        type: boolean
        optional: true
        name: sensor

  - entity: binary_sensor
    name: Unknown DPS188
    category: diagnostic
    hidden: true
    dps:
      - id: 188
        type: boolean
        optional: true
        name: sensor

  - entity: number
    name: Operating state
    category: config
    icon: "mdi:state-machine"
    hidden: true
    dps:
      - id: 101
        type: integer
        name: value
        range:
          min: 1
          max: 10000

  - entity: text
    name: Charger info
    category: diagnostic
    icon: "mdi:information"
    hidden: true
    dps:
      - id: 106
        type: string
        name: value

  - entity: text
    name: Charge mode
    category: config
    icon: "mdi:ev-station"
    hidden: true
    dps:
      - id: 151
        type: string
        name: value

  - entity: text
    name: Language config
    icon: "mdi:translate"
    category: config
    hidden: true
    dps:
      - id: 153
        type: string
        optional: true
        name: value

  - entity: button
    name: Refresh
    category: config
    hidden: unavailable
    dps:
      - id: 188
        type: boolean
        optional: true
        name: button
      - id: 188
        type: boolean
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true

  # --- L1 Phase ---
  - entity: sensor
    name: L1 Voltage
    class: voltage
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: L1[0]
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: L1 Current
    class: current
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: L1[1]
        unit: A
        mapping:
          - scale: 10

  - entity: sensor
    name: L1 Power
    class: power
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: L1[2]
        unit: kW
        mapping:
          - scale: 10

  # --- L2 Phase ---
  - entity: sensor
    name: L2 Voltage
    class: voltage
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: L2[0]
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: L2 Current
    class: current
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: L2[1]
        unit: A
        mapping:
          - scale: 10

  - entity: sensor
    name: L2 Power
    class: power
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: L2[2]
        unit: kW
        mapping:
          - scale: 10

  # --- L3 Phase ---
  - entity: sensor
    name: L3 Voltage
    class: voltage
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: L3[0]
        unit: V
        mapping:
          - scale: 10

  - entity: sensor
    name: L3 Current
    class: current
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: L3[1]
        unit: A
        mapping:
          - scale: 10

  - entity: sensor
    name: L3 Power
    class: power
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: L3[2]
        unit: kW
        mapping:
          - scale: 10

  # --- Totals and session data ---
  - entity: sensor
    name: Total Power
    class: power
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: p
        unit: kW
        mapping:
          - scale: 10

  - entity: sensor
    name: Session Energy
    class: energy
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: e
        unit: kWh
        mapping:
          - scale: 10

  - entity: sensor
    name: Temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: t
        unit: C
        mapping:
          - scale: 10

  - entity: sensor
    name: Session Duration
    class: duration
    category: diagnostic
    dps:
      - id: 102
        type: json
        name: sensor
        json_path: d
        unit: s
        mapping:
          - scale: 10

  # --- DPS 106 sub-fields ---
  - entity: sensor
    name: Firmware version
    category: diagnostic
    icon: "mdi:chip"
    dps:
      - id: 106
        type: json
        name: sensor
        json_path: fv

  - entity: sensor
    name: CP Voltage
    class: voltage
    category: diagnostic
    dps:
      - id: 106
        type: json
        name: sensor
        json_path: cp
        unit: V

  - entity: sensor
    name: Total Energy
    class: energy
    category: diagnostic
    dps:
      - id: 106
        type: json
        name: sensor
        json_path: e
        unit: kWh
        mapping:
          - scale: 10

  - entity: sensor
    name: Charge cycles
    category: diagnostic
    icon: "mdi:counter"
    dps:
      - id: 106
        type: json
        name: sensor
        json_path: t
        unit: cycles
        mapping:
          - scale: 10
